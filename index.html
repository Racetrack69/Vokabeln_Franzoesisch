<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17357E">
<title>Vocabulaire – Französisch lernen</title>
<style>
  :root{
    --paper:#F4F5F2;
    --card-paper:#FFFFFF;
    --ink:#1C1E28;
    --muted:#666B7A;
    --plate:#17357E;
    --plate-deep:#10275F;
    --plate-text:#FFFFFF;
    --rose:#D693AC;
    --rule:#C6D9EC;
    --line:#D9DBE0;
    --radius:18px;
    --tap:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.45;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  button{font:inherit;color:inherit}
  button,[role="button"]{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  :focus-visible{outline:3px solid var(--plate);outline-offset:3px;border-radius:6px}

  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100%;
    padding:
      max(14px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
  }
  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}

  /* ---------- Startseite ---------- */
  .home-head{padding:18px 2px 10px}
  .home-head h1{
    margin:0;
    font-size:38px;
    line-height:1.05;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .home-head p{margin:8px 0 0;color:var(--muted);font-size:16px}

  .toggle{
    display:flex;
    background:#E7E9EE;
    border-radius:12px;
    padding:4px;
    margin:16px 0 22px;
  }
  .toggle button{
    flex:1;
    border:0;
    background:transparent;
    border-radius:9px;
    padding:10px 8px;
    font-weight:600;
    font-size:15px;
    color:var(--muted);
    transition:background .15s, color .15s;
  }
  .toggle button[aria-pressed="true"]{
    background:#fff;
    color:var(--plate);
    box-shadow:0 1px 3px rgba(20,30,60,.12);
  }

  .topics{
    list-style:none;margin:0;padding:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .topics li{display:contents}
  .topic{
    width:100%;
    min-height:96px;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:14px;
    padding:14px 14px 12px;
    text-align:left;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:border-color .15s, transform .1s;
  }
  .topic:active{transform:scale(.98)}
  .topic .fr{
    display:block;
    font-size:21px;
    font-weight:700;
    color:var(--plate);
    line-height:1.15;
  }
  .topic .de{display:block;color:var(--muted);font-size:14px;margin-top:6px}
  .topic.all{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:baseline;gap:10px;background:var(--plate);border-color:var(--plate)}
  .topic.all .fr{color:#fff}
  .topic.all .de{color:rgba(255,255,255,.75);margin:0}

  /* ---------- Lernseite ---------- */
  .study-head{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:8px;
    padding:4px 0 14px;
  }
  .back-btn{
    justify-self:start;
    border:0;background:transparent;
    padding:8px 6px 8px 0;
    color:var(--plate);
    font-weight:600;font-size:16px;
    display:inline-flex;align-items:center;gap:2px;
  }
  .back-btn svg{width:18px;height:18px}
  .study-head .title{
    font-weight:700;font-size:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:180px;text-align:center;
  }
  .study-head .count{
    justify-self:end;
    font-variant-numeric:tabular-nums;
    color:var(--muted);font-size:15px;font-weight:600;
  }
  .bar{height:4px;background:#E1E4EA;border-radius:2px;overflow:hidden;margin-bottom:22px}
  .bar > i{display:block;height:100%;width:0;background:var(--plate);border-radius:2px;transition:width .3s}

  .stage{
    flex:1;
    display:flex;flex-direction:column;
    transition:opacity .18s ease, transform .18s ease;
  }
  .stage.out{opacity:0;transform:translateX(-24px)}
  .stage.enter{opacity:0;transform:translateX(24px)}
  .stage.snap,.stage.snap .card-inner{transition:none !important}

  .card{
    width:100%;
    height:clamp(300px, 54vh, 440px);
    perspective:1400px;
    position:relative;
    outline-offset:6px;
  }
  .card-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.75,.2,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:var(--radius);
    overflow:hidden;
  }

  /* Vorderseite: Emaille-Schild, wie ein Pariser Straßenschild */
  .face.front{
    background:linear-gradient(160deg, var(--plate) 0%, var(--plate-deep) 100%);
    color:var(--plate-text);
    box-shadow:0 10px 30px rgba(16,39,95,.28), inset 0 1px 0 rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
    padding:28px;
  }
  .face.front::before{
    content:"";
    position:absolute;inset:11px;
    border:2px solid rgba(255,255,255,.92);
    border-radius:calc(var(--radius) - 8px);
    pointer-events:none;
  }
  .word{
    font-size:clamp(28px, 8.5vw, 40px);
    font-weight:700;
    line-height:1.15;
    text-align:center;
    letter-spacing:-0.005em;
    text-wrap:balance;
    overflow-wrap:anywhere;
  }
  .badge{
    position:absolute;top:22px;right:22px;
    width:30px;height:30px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.85);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;
    font-style:italic;
  }
  .badge.wide{width:auto;padding:0 9px;border-radius:15px}
  .hint{
    position:absolute;left:0;right:0;bottom:24px;
    text-align:center;
    font-size:14px;
    color:rgba(255,255,255,.7);
  }

  /* Rückseite: Cahier-Papier mit Seyès-Lineatur */
  .face.back{
    transform:rotateY(180deg);
    background-color:var(--card-paper);
    background-image:
      linear-gradient(to right, transparent 0, transparent 30px, var(--rose) 30px, var(--rose) 31.5px, transparent 31.5px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
    background-position:0 0, 0 22px;
    border:1.5px solid var(--line);
    box-shadow:0 10px 30px rgba(28,30,40,.12);
    padding:26px 22px 22px 46px;
    display:flex;flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .face.back .answer{
    font-size:clamp(26px, 7.5vw, 34px);
    font-weight:700;
    line-height:1.15;
    color:var(--plate);
    overflow-wrap:anywhere;
  }
  .face.back .answer .badge-inline{
    display:inline-block;vertical-align:middle;
    margin-left:8px;
    font-size:13px;font-weight:700;font-style:italic;
    color:var(--plate);
    border:1.5px solid var(--plate);
    border-radius:15px;padding:1px 8px;
    line-height:1.4;
  }
  .face.back .tip{
    margin-top:22px;
    padding-top:12px;
    border-top:1.5px solid var(--ink);
    font-size:15.5px;
    line-height:1.5;
    color:var(--ink);
  }
  .face.back .tip b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}

  .actions{
    margin-top:auto;
    padding-top:22px;
    display:flex;flex-direction:column;gap:10px;
  }
  .btn{
    width:100%;
    min-height:var(--tap);
    border-radius:14px;
    border:0;
    font-weight:700;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s, background .15s;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--plate);color:#fff}
  .btn.primary:hover{background:var(--plate-deep)}
  .btn.secondary{background:#fff;color:var(--plate);border:1.5px solid var(--line)}
  .btn svg{width:20px;height:20px}

  /* Abschluss */
  .finish{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:20px 10px;
  }
  .finish .big{font-size:34px;font-weight:700;color:var(--plate);line-height:1.1}
  .finish p{color:var(--muted);margin:10px 0 0;font-size:16px}

  @media (prefers-reduced-motion: reduce){
    .card-inner,.stage,.bar > i,.toggle button,.btn,.topic{transition:none !important}
  }
</style>
</head>
<body>
<div class="app">

  <!-- Startseite -->
  <section class="screen active" id="home">
    <header class="home-head">
      <h1>Vocabulaire</h1>
      <p>Französisch, 100 Wörter in 10 Themen. Karte antippen, um sie umzudrehen.</p>
    </header>

    <div class="toggle" role="group" aria-label="Abfragerichtung">
      <button type="button" id="dirFr" aria-pressed="true">FR → DE</button>
      <button type="button" id="dirDe" aria-pressed="false">DE → FR</button>
    </div>

    <ul class="topics" id="topics"></ul>
  </section>

  <!-- Lernseite -->
  <section class="screen" id="study">
    <header class="study-head">
      <button type="button" class="back-btn" id="backBtn" aria-label="Zurück zu den Themen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        Themen
      </button>
      <div class="title" id="studyTitle"></div>
      <div class="count" id="studyCount"></div>
    </header>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

    <div class="stage" id="stage">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
        <div class="card-inner">
          <div class="face front">
            <div class="badge" id="frontBadge" hidden></div>
            <div class="word" id="frontWord"></div>
            <div class="hint" id="hint">Tippen zum Umdrehen</div>
          </div>
          <div class="face back">
            <div class="answer" id="backWord"></div>
            <div class="tip"><b>Merkhilfe</b><span id="backTip"></span></div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="nextBtn">
          Weiter
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div class="finish" id="finish" hidden>
      <div class="big">Geschafft</div>
      <p id="finishText"></p>
      <div class="actions" style="width:100%">
        <button type="button" class="btn primary" id="againBtn">Nochmal, neu gemischt</button>
        <button type="button" class="btn secondary" id="homeBtn">Anderes Thema</button>
      </div>
    </div>
  </section>

</div>

<script>
// ============================================================
// Vokabeldaten
// fr = Französisch, de = Deutsch, g = Genus bei Nomen (m, f, m/f), tip = Merkhilfe
// ============================================================
const DECKS = [
  {
    fr: "Verbes de base", de: "Grundverben",
    cards: [
      { fr: "être", de: "sein", tip: "Das wichtigste Verb, lohnt sich komplett auswendig: je suis, tu es, il est, nous sommes, vous êtes, ils sont. Steckt in deutsch „Essenz“ (lat. esse = sein)." },
      { fr: "avoir", de: "haben", tip: "j'ai, tu as, il a, nous avons, vous avez, ils ont. Bildet zusammen mit être die Vergangenheit (passé composé): j'ai mangé = ich habe gegessen." },
      { fr: "aller", de: "gehen", tip: "je vais, tu vas, il va. „Ça va?“ heißt wörtlich „Geht es?“, da steckt aller drin. „Je vais manger“ = ich werde gleich essen." },
      { fr: "faire", de: "machen, tun", tip: "je fais, nous faisons, vous faites. Steckt in vielen Wendungen: faire la cuisine (kochen), faire du sport. Verwandt mit „Fabrik“ und „Fakt“ (lat. facere)." },
      { fr: "prendre", de: "nehmen", tip: "je prends, il prend, nous prenons. Auch „prendre le bus“, „prendre un café“. Merkhilfe: eine Prise Salz ist das, was man nimmt." },
      { fr: "vouloir", de: "wollen", tip: "je veux, tu veux, il veut, nous voulons. „Je voudrais“ (ich hätte gern) ist die höfliche Form beim Bestellen. Merkhilfe: Ein Volontär ist jemand, der will." },
      { fr: "pouvoir", de: "können, dürfen", tip: "je peux, il peut, nous pouvons. Als Nomen bedeutet „le pouvoir“ die Macht: Wer kann, hat Macht. Merkhilfe: engl. power." },
      { fr: "savoir", de: "wissen, können (gelernt)", tip: "je sais, tu sais, il sait. Unterschied: savoir nager = schwimmen können (gelernt), pouvoir = dürfen oder in der Lage sein. Merkhilfe: engl. savvy." },
      { fr: "venir", de: "kommen", tip: "je viens, il vient, nous venons. „Je viens de manger“ = ich habe gerade gegessen. Merkhilfe: Advent = die Ankunft (lat. venire)." },
      { fr: "devoir", de: "müssen", tip: "je dois, il doit, nous devons. Als Nomen: „les devoirs“ = die Hausaufgaben, also das, was man tun muss. Merkhilfe: engl. duty." }
    ]
  },
  {
    fr: "Adjectifs", de: "Adjektive",
    cards: [
      { fr: "grand / grande", de: "groß", tip: "Steht meist vor dem Nomen: un grand homme. Weiblich mit -e. Merkhilfe: Grand Prix = großer Preis." },
      { fr: "petit / petite", de: "klein", tip: "Bei „petit“ ist das t am Ende stumm, bei „petite“ hört man es. Steht vor dem Nomen. Merkhilfe: Petit Four = das kleine Gebäck." },
      { fr: "beau / belle", de: "schön", tip: "Vor Vokal wird aus beau „bel“: un bel homme. Merkhilfe: „Die Schöne und das Biest“ heißt „La Belle et la Bête“." },
      { fr: "nouveau / nouvelle", de: "neu", tip: "Vor Vokal „nouvel“: un nouvel ami. Steht vor dem Nomen. Merkhilfe: Nouvelle Cuisine = neue Küche." },
      { fr: "vieux / vieille", de: "alt", tip: "Vor Vokal „vieil“: un vieil homme. Gleiche lateinische Wurzel wie „Veteran“ (vetus = alt)." },
      { fr: "bon / bonne", de: "gut", tip: "bonjour (guter Tag), bonne nuit (gute Nacht), bon appétit. Weiblich verdoppelt das n. Merkhilfe: Bonbon = gut-gut." },
      { fr: "mauvais / mauvaise", de: "schlecht", tip: "„Il fait mauvais“ = das Wetter ist schlecht. Merkhilfe: Klingt wie „mau“ („mir ist mau“ = mir geht es schlecht)." },
      { fr: "facile", de: "leicht, einfach", tip: "Gleiche Form für männlich und weiblich. Gegenteil: difficile. Merkhilfe: Ein Facilitator macht es einfach." },
      { fr: "difficile", de: "schwierig", tip: "Gleiche Form für männlich und weiblich. Das deutsche Fremdwort „diffizil“ ist genau dasselbe Wort." },
      { fr: "cher / chère", de: "teuer, lieb", tip: "Beides: „Cher Paul“ = Lieber Paul (Briefanfang), „C'est trop cher“ = das ist zu teuer. Was einem lieb ist, ist auch teuer." }
    ]
  },
  {
    fr: "Le quotidien", de: "Nomen im Alltag",
    cards: [
      { fr: "la maison", g: "f", de: "das Haus", tip: "„à la maison“ = zu Hause. Verwandt mit engl. mansion. Weiblich, anders als im Deutschen." },
      { fr: "la voiture", g: "f", de: "das Auto", tip: "Weiblich! „en voiture“ = mit dem Auto. Aussprache: wwa-tür, das oi wird immer „wa“ gesprochen." },
      { fr: "le travail", g: "m", de: "die Arbeit", tip: "Plural unregelmäßig: les travaux (auch: die Bauarbeiten). Engl. travel stammt davon ab, Reisen war früher Mühsal." },
      { fr: "le temps", g: "m", de: "die Zeit, das Wetter", tip: "Beides! „Quel temps fait-il?“ = Wie ist das Wetter? „Je n'ai pas le temps“ = Ich habe keine Zeit. Merkhilfe: Tempo." },
      { fr: "l'argent", g: "m", de: "das Geld", tip: "Wörtlich „Silber“ (chemisches Zeichen Ag = argentum). Argentinien = Silberland. Immer Singular." },
      { fr: "le téléphone", g: "m", de: "das Telefon", tip: "Betonung wie immer auf der letzten Silbe. Das Handy heißt „le portable“ oder kurz „le tel“." },
      { fr: "la clé", g: "f", de: "der Schlüssel", tip: "Auch „clef“ geschrieben, gleiche Aussprache. Der Notenschlüssel in der Musik ist „la clé de sol“." },
      { fr: "la porte", g: "f", de: "die Tür", tip: "Merkhilfe: Portal, Portier. Nicht verwechseln mit „le port“ = der Hafen." },
      { fr: "la fenêtre", g: "f", de: "das Fenster", tip: "Der Zirkumflex (ê) ersetzt oft ein altes s: fenestre. Das ist dasselbe Wort wie „Fenster“." },
      { fr: "le livre", g: "m", de: "das Buch", tip: "„la livre“ (weiblich) ist das Pfund. Achtung: „la librairie“ ist die Buchhandlung, die Bibliothek heißt „la bibliothèque“." }
    ]
  },
  {
    fr: "À la maison", de: "Verben im Haushalt",
    cards: [
      { fr: "cuisiner", de: "kochen", tip: "Von „la cuisine“ = Küche. Genauso üblich: „faire la cuisine“." },
      { fr: "nettoyer", de: "putzen, reinigen", tip: "Von „net“ = sauber, klar. Merkhilfe: „netto“ = bereinigt. Konjugation: je nettoie (das y wird zu i)." },
      { fr: "laver", de: "waschen", tip: "„se laver“ = sich waschen, „la machine à laver“ = die Waschmaschine. Merkhilfe: Lavabo, Lavendel (die Waschpflanze)." },
      { fr: "ranger", de: "aufräumen", tip: "Etwas in Reih und Glied bringen („le rang“ = die Reihe). Falscher Freund: engl. range bedeutet etwas anderes." },
      { fr: "repasser", de: "bügeln", tip: "Wörtlich „nochmal drüberfahren“ (re + passer). „Le fer à repasser“ = das Bügeleisen." },
      { fr: "balayer", de: "fegen, kehren", tip: "Von „le balai“ = der Besen. Merkhilfe: Der Besen tanzt wie beim Ballett über den Boden." },
      { fr: "faire la vaisselle", de: "abwaschen, Geschirr spülen", tip: "„la vaisselle“ = das Geschirr, „le lave-vaisselle“ = die Spülmaschine." },
      { fr: "faire les courses", de: "einkaufen (Lebensmittel)", tip: "„courses“ heißt wörtlich „Läufe“: man läuft durch die Läden. „Faire du shopping“ ist dagegen der Klamottenbummel." },
      { fr: "arroser", de: "gießen (Pflanzen)", tip: "Von „la rosée“ = der Tau. Auch: einen Erfolg begießen (arroser un succès)." },
      { fr: "sortir la poubelle", de: "den Müll rausbringen", tip: "„la poubelle“ (Mülleimer) ist nach Eugène Poubelle benannt, dem Pariser Präfekten, der 1884 Mülltonnen vorschrieb." }
    ]
  },
  {
    fr: "En voyage", de: "Nomen auf Reisen",
    cards: [
      { fr: "la gare", g: "f", de: "der Bahnhof", tip: "Weiblich. Nicht verwechseln mit „le garage“ (Garage, Werkstatt). „la gare routière“ = der Busbahnhof." },
      { fr: "l'aéroport", g: "m", de: "der Flughafen", tip: "aéro + port = Lufthafen. Männlich wie „le port“." },
      { fr: "le billet", g: "m", de: "die Fahrkarte, das Ticket", tip: "Auch der Geldschein: „un billet de 20 euros“. In der Schweiz und Österreich sagt man „Billett“." },
      { fr: "la valise", g: "f", de: "der Koffer", tip: "Weiblich. „faire sa valise“ = packen. Merkhilfe: ital. valigia, engl. valise." },
      { fr: "l'hôtel", g: "m", de: "das Hotel", tip: "Der Zirkumflex ersetzt das alte s (hostel). Achtung: „l'hôtel de ville“ ist das Rathaus, kein Hotel." },
      { fr: "la chambre", g: "f", de: "das Zimmer", tip: "„une chambre pour deux personnes“. Merkhilfe: Kammer, engl. chamber." },
      { fr: "la plage", g: "f", de: "der Strand", tip: "Weiblich. Merkhilfe: span. playa. „aller à la plage“ = an den Strand gehen." },
      { fr: "la carte", g: "f", de: "die Karte (Speise-, Land-, Bankkarte)", tip: "„La carte, s'il vous plaît“ im Restaurant. „la carte bancaire“ = die Bankkarte, „la carte postale“ = die Postkarte." },
      { fr: "le passeport", g: "m", de: "der Reisepass", tip: "passe + port: durchs Tor kommen. Engl. passport ist dasselbe Wort." },
      { fr: "la douane", g: "f", de: "der Zoll", tip: "Aus dem Arabischen (diwan = Amt), wie ital. dogana. „Rien à déclarer“ = nichts zu verzollen." }
    ]
  },
  {
    fr: "À table", de: "Essen und Trinken",
    cards: [
      { fr: "le pain", g: "m", de: "das Brot", tip: "Nasal gesprochen: „pä(n)“. Das Baguette ist ein pain. Merkhilfe: „Kompanie“ = Brotgemeinschaft (lat. cum + panis)." },
      { fr: "le fromage", g: "m", de: "der Käse", tip: "Von lat. forma, der Form, in der Käse gepresst wird: formage wurde zu fromage. Käse in Form." },
      { fr: "l'eau", g: "f", de: "das Wasser", tip: "Nur ein Laut: „o“. Weiblich! „de l'eau“ = Wasser (Teilungsartikel). Merkhilfe: Eau de toilette." },
      { fr: "le vin", g: "m", de: "der Wein", tip: "Nasal: „wä(n)“. Klingt fast wie „vingt“ (20). vin rouge, vin blanc, vin rosé." },
      { fr: "le petit-déjeuner", g: "m", de: "das Frühstück", tip: "„le déjeuner“ ist das Mittagessen (wörtlich: das Fasten brechen), das kleine davon ist das Frühstück. „le dîner“ = das Abendessen." },
      { fr: "le légume", g: "m", de: "das Gemüse", tip: "Männlich, obwohl es auf -e endet. Merkhilfe: Leguminosen = Hülsenfrüchte." },
      { fr: "la viande", g: "f", de: "das Fleisch", tip: "Von lat. vivenda = Lebensmittel, hat also mit „vivre“ (leben) zu tun, nicht mit Vieh." },
      { fr: "le poulet", g: "m", de: "das Hähnchen", tip: "„la poule“ = die Henne, „le poulet“ = das Hähnchen. Merkhilfe: engl. poultry = Geflügel." },
      { fr: "le sucre", g: "m", de: "der Zucker", tip: "Zucker, sucre, sugar: alle aus dem Arabischen sukkar. „sucré“ = süß, gezuckert." },
      { fr: "l'addition", g: "f", de: "die Rechnung (im Restaurant)", tip: "„L'addition, s'il vous plaît!“ Wörtlich „die Zusammenzählung“. Die Handwerkerrechnung heißt „la facture“." }
    ]
  },
  {
    fr: "La semaine", de: "Zeit und Wochentage",
    cards: [
      { fr: "lundi", de: "Montag", tip: "„la lune“ = der Mond, also Mondtag wie im Deutschen. Wochentage werden kleingeschrieben. Fast alle enden auf -di (lat. dies = Tag)." },
      { fr: "mardi", de: "Dienstag", tip: "Tag des Mars. Merkhilfe: Mardi Gras = Fetter Dienstag, der Karnevalsdienstag." },
      { fr: "mercredi", de: "Mittwoch", tip: "Tag des Merkur. Merkhilfe: Mercredi liegt in der Mitte der Woche, wie Mittwoch." },
      { fr: "jeudi", de: "Donnerstag", tip: "Tag des Jupiter (lat. Jovis dies). Im Deutschen ist es Donar (Thor), derselbe Gott in germanisch." },
      { fr: "vendredi", de: "Freitag", tip: "Tag der Venus. Im Deutschen Freya, ebenfalls die Liebesgöttin. Gleiche Logik, anderes Pantheon." },
      { fr: "samedi", de: "Samstag", tip: "Sabbat-Tag (lat. sambati dies). Das deutsche „Samstag“ hat exakt dieselbe Herkunft." },
      { fr: "dimanche", de: "Sonntag", tip: "Lat. dies dominica = Tag des Herrn. Der einzige Wochentag, bei dem das „di“ vorne statt hinten steht." },
      { fr: "aujourd'hui", de: "heute", tip: "Wörtlich „am Tag von heute“ (au jour d'hui), „hui“ allein hieß früher schon heute. Apostroph nicht vergessen." },
      { fr: "demain", de: "morgen", tip: "Nicht mit „le matin“ (der Morgen, Tageszeit) verwechseln. „à demain“ = bis morgen, „après-demain“ = übermorgen." },
      { fr: "hier", de: "gestern", tip: "Falscher Freund: sieht aus wie deutsch „hier“, heißt aber gestern. Aussprache „jär“. „avant-hier“ = vorgestern." }
    ]
  },
  {
    fr: "La famille", de: "Familie und Menschen",
    cards: [
      { fr: "la famille", g: "f", de: "die Familie", tip: "Das Doppel-l wird als „j“ gesprochen: „fa-mij“. Wie bei fille (Tochter, Mädchen)." },
      { fr: "le père", g: "m", de: "der Vater", tip: "Klingt genau wie „la paire“ (das Paar). Umgangssprachlich „papa“. Merkhilfe: lat. pater." },
      { fr: "la mère", g: "f", de: "die Mutter", tip: "Klingt genau wie „la mer“ (das Meer) und „le maire“ (der Bürgermeister). Nur der Kontext unterscheidet." },
      { fr: "le frère", g: "m", de: "der Bruder", tip: "Merkhilfe: „Fraternité“ aus dem Motto der Republik (Brüderlichkeit)." },
      { fr: "la sœur", g: "f", de: "die Schwester", tip: "Das œ ist eine Ligatur, gesprochen etwa „sör“. Merkhilfe: lat. soror, engl. sister." },
      { fr: "l'enfant", g: "m/f", de: "das Kind", tip: "Gleiche Form für Junge und Mädchen, nur der Artikel wechselt: un enfant, une enfant. Merkhilfe: „Infant“ = das Nicht-Sprechende (lat. in-fans)." },
      { fr: "le mari", g: "m", de: "der Ehemann", tip: "„marié“ = verheiratet. Nicht mit „mardi“ (Dienstag) verwechseln. Merkhilfe: engl. marital." },
      { fr: "la femme", g: "f", de: "die Frau, die Ehefrau", tip: "Aussprache „famm“, nicht „fem“! Bedeutet beides: Frau allgemein und Ehefrau („ma femme“)." },
      { fr: "l'ami / l'amie", g: "m/f", de: "der Freund / die Freundin", tip: "Merkhilfe: Amigo. Der feste Freund ist „le petit ami“, ohne petit ist es einfach ein Freund." },
      { fr: "les gens", de: "die Leute", tip: "Immer Plural. Aussprache nasal „schã(n)“. Merkhilfe: engl. gentle, gentry." }
    ]
  },
  {
    fr: "En ville", de: "Stadt und Verkehr",
    cards: [
      { fr: "la rue", g: "f", de: "die Straße", tip: "Fast jedes Straßenschild in Frankreich beginnt mit „Rue“. Die große Straße ist „le boulevard“ oder „l'avenue“." },
      { fr: "la place", g: "f", de: "der Platz", tip: "Place de la Concorde. Auch Sitzplatz oder Stelle. Platz, place, plaza: alle verwandt." },
      { fr: "le métro", g: "m", de: "die U-Bahn", tip: "Kurz für „chemin de fer métropolitain“. Der Pariser Métro hat dem Wort weltweit den Namen gegeben." },
      { fr: "le pont", g: "m", de: "die Brücke", tip: "Der „Pont Neuf“ (Neue Brücke) ist trotz des Namens die älteste Brücke von Paris. Merkhilfe: Pontifex = Brückenbauer." },
      { fr: "le feu rouge", g: "m", de: "die Ampel", tip: "Wörtlich „das rote Feuer“. „le feu vert“ = grün. Die Ampel ist ein Feuer, das die Farbe wechselt." },
      { fr: "à gauche", de: "links", tip: "Merkhilfe: engl. gauche = ungeschickt, also „linkisch“. Gegenteil: à droite." },
      { fr: "à droite", de: "rechts", tip: "„le droit“ ist auch das Recht (juristisch). Klassische Falle: à droite (rechts) vs. tout droit (geradeaus)." },
      { fr: "tout droit", de: "geradeaus", tip: "Wörtlich „ganz gerade“. Nicht verwechseln mit à droite (rechts). „Continuez tout droit“ = Fahren Sie geradeaus weiter." },
      { fr: "le vélo", g: "m", de: "das Fahrrad", tip: "Kurz für vélocipède (schneller Fuß). Merkhilfe: engl. velocity. „à vélo“ = mit dem Rad." },
      { fr: "l'arrêt", g: "m", de: "die Haltestelle", tip: "„l'arrêt de bus“. Merkhilfe: engl. arrest = anhalten. Zirkumflex auf dem ê (altes s: arrest)." }
    ]
  },
  {
    fr: "Les phrases utiles", de: "Nützliche Sätze",
    cards: [
      { fr: "Bonjour", de: "Guten Tag", tip: "Wörtlich „guter Tag“. In Frankreich sagt man es beim Betreten jedes Ladens, das gilt als Pflichthöflichkeit. Ab dem Abend: bonsoir." },
      { fr: "Comment ça va\u00A0?", de: "Wie geht's?", tip: "Antwort: „Ça va bien, merci. Et toi\u00A0?“ Im Französischen steht vor ? und ! ein Leerzeichen." },
      { fr: "Je m'appelle …", de: "Ich heiße …", tip: "Wörtlich „ich nenne mich“ (s'appeler). Merkhilfe: Appell. Doppel-l bei je, tu, il: je m'appelle, aber nous nous appelons." },
      { fr: "Enchanté(e)", de: "Freut mich (Sie kennenzulernen)", tip: "Wörtlich „verzaubert“. Frauen schreiben enchantée, gesprochen klingt es gleich. Merkhilfe: engl. enchanted." },
      { fr: "S'il vous plaît", de: "Bitte", tip: "Wörtlich „wenn es Ihnen gefällt“. Unter Freunden: s'il te plaît. Abgekürzt SVP oder STP." },
      { fr: "Merci beaucoup", de: "Vielen Dank", tip: "„beaucoup“ = viel. Mögliche Antworten: „De rien“ (wörtlich: von nichts) oder „Je vous en prie“." },
      { fr: "Excusez-moi", de: "Entschuldigen Sie", tip: "Um jemanden anzusprechen (im Laden, auf der Straße). Nach einem Rempler: „Pardon“. Bedauern: „Désolé(e)“." },
      { fr: "Je ne comprends pas", de: "Ich verstehe nicht", tip: "Die Verneinung ist eine Klammer: ne … pas. Umgangssprachlich fällt das „ne“ weg: „Je comprends pas“. Merkhilfe: engl. comprehend." },
      { fr: "Parlez-vous anglais\u00A0?", de: "Sprechen Sie Englisch?", tip: "Sprachen werden kleingeschrieben: anglais, allemand, français. „Je parle un peu français“ = Ich spreche ein bisschen Französisch." },
      { fr: "Au revoir", de: "Auf Wiedersehen", tip: "Wörtlich „bis zum Wiedersehen“ (re + voir = wieder sehen). Exakt dieselbe Logik wie im Deutschen. Locker: „Salut“ (heißt auch Hallo)." }
    ]
  }
];

// ============================================================
// App-Logik
// ============================================================
const $ = id => document.getElementById(id);

const state = {
  direction: "fr",      // "fr" = Französisch vorne, "de" = Deutsch vorne
  deck: [],
  title: "",
  deckIndex: null,      // null = alles gemischt
  idx: 0,
  flippedOnce: false,
  busy: false
};

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function genderLabel(g){
  if (!g) return "";
  return g === "m/f" ? "m / f" : g;
}

// ---------- Startseite ----------
function renderTopics(){
  const ul = $("topics");
  ul.innerHTML = "";
  DECKS.forEach((d, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "topic";
    b.innerHTML = `<span class="fr" lang="fr">${d.fr}</span><span class="de">${d.de}</span>`;
    b.addEventListener("click", () => startDeck(i));
    li.appendChild(b);
    ul.appendChild(li);
  });
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.className = "topic all";
  b.innerHTML = `<span class="fr" lang="fr">Tout mélangé</span><span class="de">Alle 100 Karten gemischt</span>`;
  b.addEventListener("click", () => startDeck(null));
  li.appendChild(b);
  ul.appendChild(li);
}

function setDirection(dir){
  state.direction = dir;
  $("dirFr").setAttribute("aria-pressed", dir === "fr");
  $("dirDe").setAttribute("aria-pressed", dir === "de");
}

// ---------- Lernseite ----------
function startDeck(i){
  state.deckIndex = i;
  if (i === null) {
    state.deck = shuffle(DECKS.flatMap(d => d.cards));
    state.title = "Tout mélangé";
  } else {
    state.deck = shuffle(DECKS[i].cards);
    state.title = DECKS[i].de;
  }
  state.idx = 0;
  $("studyTitle").textContent = state.title;
  $("finish").hidden = true;
  $("stage").hidden = false;
  showScreen("study");
  snapReset();
  render();
  $("card").focus({ preventScroll: true });
}

function render(){
  const c = state.deck[state.idx];
  const frFront = state.direction === "fr";
  const front = frFront ? c.fr : c.de;
  const back = frFront ? c.de : c.fr;

  const fw = $("frontWord");
  fw.textContent = front;
  fw.setAttribute("lang", frFront ? "fr" : "de");

  const fb = $("frontBadge");
  if (frFront && c.g) {
    fb.textContent = genderLabel(c.g);
    fb.classList.toggle("wide", c.g === "m/f");
    fb.hidden = false;
  } else {
    fb.hidden = true;
  }

  const bw = $("backWord");
  bw.innerHTML = "";
  const span = document.createElement("span");
  span.textContent = back;
  span.setAttribute("lang", frFront ? "de" : "fr");
  bw.appendChild(span);
  if (!frFront && c.g) {
    const badge = document.createElement("span");
    badge.className = "badge-inline";
    badge.textContent = genderLabel(c.g);
    bw.appendChild(badge);
  }

  $("backTip").textContent = c.tip;
  $("hint").hidden = state.flippedOnce;
  $("studyCount").textContent = `${state.idx + 1} / ${state.deck.length}`;
  $("barFill").style.width = `${((state.idx + 1) / state.deck.length) * 100}%`;
  $("card").setAttribute("aria-label", "Karte umdrehen: " + front);
}

function snapReset(){
  const stage = $("stage");
  stage.classList.add("snap");
  $("card").classList.remove("flipped");
  stage.classList.remove("out", "enter");
  void stage.offsetWidth;
  stage.classList.remove("snap");
}

function flip(){
  if (state.busy) return;
  const card = $("card");
  card.classList.toggle("flipped");
  if (!state.flippedOnce) {
    state.flippedOnce = true;
    $("hint").hidden = true;
  }
  // Rückseite beim Umdrehen wieder nach oben scrollen
  card.querySelector(".face.back").scrollTop = 0;
}

function next(){
  if (state.busy) return;
  if (state.idx >= state.deck.length - 1) { finish(); return; }
  state.busy = true;
  const stage = $("stage");
  stage.classList.add("out");
  setTimeout(() => {
    state.idx++;
    stage.classList.add("snap");
    stage.classList.remove("out");
    stage.classList.add("enter");
    $("card").classList.remove("flipped");
    render();
    void stage.offsetWidth;
    stage.classList.remove("snap");
    stage.classList.remove("enter");
    state.busy = false;
  }, 180);
}

function finish(){
  $("stage").hidden = true;
  const f = $("finish");
  $("finishText").textContent =
    `${state.deck.length} Karten aus „${state.title}“ durchgesehen.`;
  f.hidden = false;
  $("againBtn").focus({ preventScroll: true });
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}

// ---------- Events ----------
$("dirFr").addEventListener("click", () => setDirection("fr"));
$("dirDe").addEventListener("click", () => setDirection("de"));

$("card").addEventListener("click", flip);
$("card").addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});
$("nextBtn").addEventListener("click", next);
$("backBtn").addEventListener("click", () => showScreen("home"));
$("homeBtn").addEventListener("click", () => showScreen("home"));
$("againBtn").addEventListener("click", () => startDeck(state.deckIndex));

document.addEventListener("keydown", e => {
  if (!$("study").classList.contains("active") || $("stage").hidden) return;
  if (e.key === "ArrowRight") { e.preventDefault(); next(); }
});

renderTopics();
setDirection("fr");
</script>
</body>
</html>
